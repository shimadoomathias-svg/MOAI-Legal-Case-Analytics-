services:
  - type: web
    name: moai-legal-case-analytics
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moai-legal-analytics-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: APP_PUBLIC_URL
        value: https://moai-legal-case-analytics.onrender.com

databases:
  - name: moai-legal-analytics-db
